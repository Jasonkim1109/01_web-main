<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계좌 카드</title>
  <!-- 수정 내역: 계좌 카드 전용 외부 CSS 파일을 연결했습니다. -->
  <link rel="stylesheet" href="02_html기초.css">
</head>
<body>
  <article>
    <!-- 수정 내역: article 안의 header, section, footer 구조는 카드의 영역을 의미별로 구분합니다. -->
    <header>
      <h2>하나은행</h2>
    </header>

    <section>
      <p>123-****-****</p>
      <p>잔액: <data value="5000000">5,000,000원</data></p>
    </section>

    <footer>
      <button type="button">이체</button>
      <button type="button">상세</button>
    </footer>
  </article>
</body>
</html>
